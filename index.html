<!doctype html>
<html lang="ru" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="SupportOS local-first bind knowledge base." />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <title>SupportOS</title>

    <script>
      (() => {
        try {
          const mode = localStorage.getItem("supportos-theme-mode") || localStorage.getItem("supportos-theme") || "dark";
          const theme = mode === "system" ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : mode;
          document.documentElement.classList.toggle("dark", theme !== "light");
          document.documentElement.style.colorScheme = theme === "light" ? "light" : "dark";
        } catch {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>

  <body class="bg-background text-foreground antialiased">
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
