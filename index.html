<!doctype html>
<html lang="ru" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="SupportOS local-first bind knowledge base." />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <title>SupportOS</title>
    <style>
      #startup-screen { min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: #f8fafc; color: #0f172a; font: 14px/1.6 system-ui, sans-serif; }
      .dark #startup-screen { background: #000; color: #f4f4f5; }
      #startup-screen section { width: min(100%, 336px); text-align: center; }
      #startup-screen img { display: block; margin: 0 auto; }
      #startup-screen h1 { font-size: 20px; margin: 16px 0 8px; }
      #startup-message { opacity: .7; }
      #startup-retry { margin-top: 16px; padding: 10px 18px; border: 1px solid #71717a; border-radius: 10px; background: #a1a1aa; color: #09090b; cursor: pointer; font: inherit; }
    </style>

    <script>
      (() => {
        try {
          const mode = localStorage.getItem("supportos-theme-mode") || localStorage.getItem("supportos-theme") || "dark";
          const theme = mode === "system" ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : mode;
          document.documentElement.classList.toggle("dark", theme !== "light");
          document.documentElement.style.colorScheme = theme === "light" ? "light" : "dark";
        } catch {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>

  <body class="bg-background text-foreground antialiased">
    <div id="app">
      <main id="startup-screen" aria-label="Загрузка SupportOS">
        <section>
          <img src="/icon.svg" width="40" height="40" alt="" />
          <h1>Открываем SupportOS</h1>
          <p id="startup-message" role="status">Загружаем рабочее пространство…</p>
          <button id="startup-retry" type="button" hidden>Загрузить заново</button>
          <noscript><p>Для работы SupportOS включите JavaScript в браузере.</p></noscript>
        </section>
      </main>
    </div>
    <script src="/startup.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
